# Minimal Supabase CLI config for local development.
# Run: supabase start && supabase db reset

project_id = "sdms-local"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

[db.seed]
enabled = true
sql_paths = ["./seed/demo.sql"]